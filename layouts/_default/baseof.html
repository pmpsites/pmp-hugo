<!DOCTYPE html>
<html lang="en-GB">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    <a class="skip-main" href="#main">Skip to main content</a>
    <main id="main" class="main {{ .Params.page}} {{ .Params.layout}}" role="main">
    <div class="container">
    {{ partial "header.html" . }}

    {{ block "main" . }}
      {{ .Content }}
    {{ end }}
    
    {{ partial "footer.html" . }}
</div><!-- div.container -->
</main><!-- div.main -->    
    
</body>
</html>
